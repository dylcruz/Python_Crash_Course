<!DOCTYPE html>
<p>Blog Site</p>
<p>
  <a href="{% url 'blog_site:index' %}">Home</a> -
  <a href="{% url 'blog_site:blogs' %}">Blogs</a> - 
  {% if user.is_authenticated %} Hello, {{ user.username }} {% else %}
  <a href="{% url 'accounts:registration' %}">Register</a> -
  <a href="{% url 'accounts:login' %}">Login</a>
  {% endif %}
</p>
{% block content %}{% endblock content %}
<hr />
{% if user.is_authenticated %}
<form action="{% url 'accounts:logout' %}" method="post">
  {% csrf_token %} <button name="submit">Log out</button>
</form>
{% endif %}
