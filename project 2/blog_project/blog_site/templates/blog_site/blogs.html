{% extends "blog_site/base.html" %}{% block content %}
<p>Current Blogs:</p>
<ul>
  {% for blog in blogs %}
  <li><a href="{% url 'blog_site:blog' blog.id %}">{{ blog.name }}</a></li>
  {% empty %}
  <li>There are no blogs.</li>
  {% endfor %}
</ul>
<p><a href="{% url 'blog_site:create_blog' %}">Create A New Blog</a></p>
{% endblock content %}
