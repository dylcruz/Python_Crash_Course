{% extends "blog_site/base.html" %}{% block content %}
<p>{{ blog.name }} Entries:</p>
<ul>
  {% for entry in entries %}
  <li>{{ entry.text }}</li>
  <p></p><a href="{% url 'blog_site:edit_entry' entry.id %}">Edit Entry</a></p>
  {% empty %}
  <li>There are no entries in this blog.</li>
  {% endfor %}
</ul>
<p><a href="{% url 'blog_site:create_entry' blog.id %}">Create New Entry</a></p>
{% endblock content %}
